stages:
  - build
  - deploy-dev
  - deploy-prod

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://dockerhost:2375
  # This instructs Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  CONTAINER_TEST_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  CONTAINER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE:latest
  NODE_VERSION: '20'



# Cache node_modules for faster builds
cache:
  key: '$CI_COMMIT_REF_SLUG'
  paths:
    - node_modules/
    - .nx/cache/

before_script:
  - apt-get update -qq && apt-get install -y -qq git curl
  - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
  - apt-get install -y nodejs
  - npm install -g vercel
  - npm ci

# Build all applications
build:
  stage: build
  script:
    - npx nx run user-svc:build
    - npx nx run media-svc:build
    - npx nx run tags-svc:build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - feature/merge-and-complete-pipelines
    - develop
    - master

# Deploy to development environment
deploy-dev-user-svc:
  stage: deploy-dev
  dependencies:
    - build
  script:
    - echo "Deploying user-svc to development environment"
    - cp vercel-user-svc.json vercel.json
    - vercel --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes
  environment:
    name: development/user-svc
    url: $DEV_USER_SVC_URL
  only:
    - feature/merge-and-complete-pipelines
    - develop

deploy-dev-media-svc:
  stage: deploy-dev
  dependencies:
    - build
  script:
    - echo "Deploying media-svc to development environment"
    - cp vercel-media-svc.json vercel.json
    - vercel --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes
  environment:
    name: development/media-svc
    url: $DEV_MEDIA_SVC_URL
  only:
    - feature/merge-and-complete-pipelines
    - develop

deploy-dev-tags-svc:
  stage: deploy-dev
  dependencies:
    - build
  script:
    - echo "Deploying tags-svc to development environment"
    - cp vercel-tags-svc.json vercel.json
    - vercel --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes
  environment:
    name: development/tags-svc
    url: $DEV_TAGS_SVC_URL
  only:
    - feature/merge-and-complete-pipelines
    - develop

# Deploy to production environment
deploy-prod-user-svc:
  stage: deploy-prod
  dependencies:
    - build
  script:
    - echo "Deploying user-svc to production environment"
    - cp vercel-user-svc.json vercel.json
    - vercel --prod --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes
  environment:
    name: production/user-svc
    url: $PROD_USER_SVC_URL
  only:
    - master

deploy-prod-media-svc:
  stage: deploy-prod
  dependencies:
    - build
  script:
    - echo "Deploying media-svc to production environment"
    - cp vercel-media-svc.json vercel.json
    - vercel --prod --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes
  environment:
    name: production/media-svc
    url: $PROD_MEDIA_SVC_URL
  only:
    - master

deploy-prod-tags-svc:
  stage: deploy-prod
  dependencies:
    - build
  script:
    - echo "Deploying tags-svc to production environment"
    - cp vercel-tags-svc.json vercel.json
    - vercel --prod --token $VERCEL_TOKEN --scope $VERCEL_ORG_ID --yes
  environment:
    name: production/tags-svc
    url: $PROD_TAGS_SVC_URL
  only:
    - master
