apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-media
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/technologycompany/mediashare.git
    targetRevision: k8s
    path: k8s/dev/media-svc/live
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
